<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Me contacter - Portfolio Technique">
    <meta name="theme-color" content="#1a0f2e">
    <title>Contact | Lagarde Tymothé</title>

    <!-- Polices (Google Fonts - Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Icons (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- Minimal Glassmorphic Navigation -->
    <nav class="glass-nav">
        <div class="nav-wrapper">
            <div class="nav-tabs">
                <a href="index.html" class="nav-tab">
                    <i class="fa-solid fa-home"></i>
                    <span>Accueil</span>
                </a>
                <a href="projets.html" class="nav-tab">
                    <i class="fa-solid fa-code"></i>
                    <span>Projets</span>
                </a>
                <a href="parcours.html" class="nav-tab">
                    <i class="fa-solid fa-timeline"></i>
                    <span>Parcours</span>
                </a>
                <a href="contact.html" class="nav-tab active">
                    <i class="fa-solid fa-address-card"></i>
                    <span>Contact</span>
                </a>
            </div>
        </div>
    </nav>

    <main>
        <!-- Contact Section -->
        <section id="contact" class="contact section page-section">
            <div class="container" style="max-width: 800px;">
                <h2 class="section-title">Contacts</h2>
                <p class="contact-subtitle">
                    Prêt à collaborer ? Retrouvez toutes mes coordonnées ci-dessous.
                </p>

                <div class="contact-unified-wrapper">
                    <div class="project-card-wrapper" style="padding: 2rem;">

                        <!-- Email -->
                        <div class="contact-row">
                            <div class="contact-icon-small">
                                <i class="fa-solid fa-envelope"></i>
                            </div>
                            <div class="contact-info">
                                <span class="contact-label">Email</span>
                                <a href="mailto:lagarde.tymothe@gmail.com"
                                    class="contact-value">lagarde.tymothe@gmail.com</a>
                            </div>
                            <button class="copy-btn tooltip"
                                onclick="copyToClipboard('lagarde.tymothe@gmail.com', this)">
                                <i class="fa-regular fa-copy"></i>
                                <span class="tooltiptext">Copier</span>
                            </button>
                        </div>

                        <!-- Phone -->
                        <div class="contact-row">
                            <div class="contact-icon-small">
                                <i class="fa-solid fa-phone"></i>
                            </div>
                            <div class="contact-info">
                                <span class="contact-label">Téléphone</span>
                                <a href="tel:+33651175255" class="contact-value">06 51 17 52 55</a>
                            </div>
                            <button class="copy-btn tooltip" onclick="copyToClipboard('0651175255', this)">
                                <i class="fa-regular fa-copy"></i>
                                <span class="tooltiptext">Copier</span>
                            </button>
                        </div>

                        <!-- Location -->
                        <div class="contact-row">
                            <div class="contact-icon-small">
                                <i class="fa-solid fa-location-dot"></i>
                            </div>
                            <div class="contact-info">
                                <span class="contact-label">Localisation</span>
                                <span class="contact-value">Montpellier, France</span>
                            </div>
                        </div>

                        <div class="contact-divider"></div>

                        <!-- Social Links -->
                        <div class="contact-socials-row">
                            <a href="https://github.com/Wuy-Bots" target="_blank" class="social-btn">
                                <i class="fa-brands fa-github"></i>
                                <span>GitHub</span>
                            </a>
                            <a href="https://linkedin.com/in/tymothé-lagarde-95a6523ab/" target="_blank"
                                class="social-btn">
                                <i class="fa-brands fa-linkedin"></i>
                                <span>LinkedIn</span>
                            </a>
                        </div>

                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Lagarde Tymothé - Portfolio technique</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="js/script.js"></script>
</body>

</html>
